# Painel do dono (apps/web) no Netlify. Monorepo pnpm: o build roda a partir da raiz.
# Variáveis no painel do Netlify: NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY.
[build]
  command = "pnpm turbo run build --filter=@aivo/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
