name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  compose:
    name: Docker Compose + migrations + seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start services
        run: docker compose up -d --wait

      - name: Check Postgres
        run: docker compose exec -T postgres psql -U aivo -d aivo -c 'select 1'

      - name: Check Redis
        run: docker compose exec -T redis redis-cli ping

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@aivo/api...

      - name: Migrate and seed
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm db:seed

      - name: Check seeded data
        run: |
          agents=$(docker compose exec -T postgres psql -U aivo -d aivo -tAc 'select count(*) from agents')
          echo "agents: $agents"
          test "$agents" -gt 0

      - name: Tear down
        if: always()
        run: docker compose down -v
