<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escritório IA da Loja</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f3f4f8;
        color: #1f2433;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #6b7286;
        margin: 0.25rem 0;
      }
      code {
        background: #fff;
        border: 1px solid #e1e5ee;
        border-radius: 6px;
        padding: 0.1rem 0.4rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Olá! O servidor do escritório está no ar.</h1>
      <p>Esta é a página da Fase 1. O cadeado na barra do navegador confirma o HTTPS.</p>
      <p>Saúde da API: <code>/api/health</code> · Estado do escritório: <code>/api/status</code></p>
    </main>
  </body>
</html>
